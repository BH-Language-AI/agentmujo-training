# SAL2B-SFT01 — prva produkcijska SFT za bh-llm-basic-1-2b (Salamandra-2B baza).
# Mix: bosnian_core v0.2 (98k, Sag69/MIT, dedup) + bosnian_instructions v0.1 (1.5k)
# -> train 99.419, eval 429 (127 bc-valid frozen + 302 holdout, disjunktno).
# r16/a32, bf16, batch 2x8, 1 epoha ~6214 koraka (~20-35h MI250X). small-g, time 60h.
# Recept: lr 5e-5 (Qwen-2B joint iskustvo), Llama-2 INST template (Salamandra familija).
experiment_id: sal2b-sft01
mode: sft
model_name: BSC-LT/salamandra-2b
model_revision: f3a6092c93948fea08ab618388d7b78c40ad63df
base_adapter: null
dataset: local
data_file: /scratch/project_465003647/agentmujo/jobs/sal2b-sft01/data/train.jsonl
split: train
max_samples: null
output_dir: /scratch/project_465003647/agentmujo/outputs/sal2b-sft01
max_seq_length: 2048
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 1
warmup_ratio: 0.05
weight_decay: 0.0
logging_steps: 50
save_steps: 1000
save_total_limit: 2
gradient_checkpointing: true
load_in_4bit: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
optim: paged_adamw_8bit
loss_type: nll
seed: 37
resume_from_checkpoint: null
eval_file: /scratch/project_465003647/agentmujo/jobs/sal2b-sft01/data/eval.jsonl
eval_steps: 500
# Salamandra-2B base nema chat_template (Llama-2 INST format, kao instruct familija).
chat_template: "{% for message in messages %}{% if message['role'] == 'user' %}{{ '[INST] ' + message['content'] + ' [/INST] ' }}{% elif message['role'] == 'assistant' %}{{ message['content'] + ' </s>' }}{% elif message['role'] == 'system' %}{{ '<<SYS>>\n' + message['content'] + '\n<</SYS>>\n\n' }}{% endif %}{% endfor %}"
