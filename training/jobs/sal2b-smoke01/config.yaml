# SAL2B-SMOKE — dimni test Salamandra-2B stacka na LUMI dev-g.
# Cilj: dokazati da job_run.py radi sa bazom BEZ chat_templatea (forsiran iz configa).
# 200 uzoraka / 60 koraka / seq 1024. Ocekivano: loss pada, adapter validan.
experiment_id: sal2b-smoke01
mode: sft
model_name: BSC-LT/salamandra-2b
model_revision: f3a6092c93948fea08ab618388d7b78c40ad63df
base_adapter: null
dataset: local
data_file: /scratch/project_465003647/agentmujo/jobs/sal2b-smoke01/data/smoke_train.jsonl
split: train
max_samples: null
output_dir: /scratch/project_465003647/agentmujo/outputs/sal2b-smoke01
max_seq_length: 1024
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1
max_steps: 60
warmup_ratio: 0.1
weight_decay: 0.0
logging_steps: 5
save_steps: 30
save_total_limit: 1
gradient_checkpointing: true
load_in_4bit: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
optim: paged_adamw_8bit
loss_type: nll
seed: 37
resume_from_checkpoint: null
eval_file: /scratch/project_465003647/agentmujo/jobs/sal2b-smoke01/data/smoke_eval.jsonl
eval_steps: 20
# Salamandra-2B base nema chat_template (Llama-2 INST format, kao instruct familija).
chat_template: "{% for message in messages %}{% if message['role'] == 'user' %}{{ '[INST] ' + message['content'] + ' [/INST] ' }}{% elif message['role'] == 'assistant' %}{{ message['content'] + ' </s>' }}{% elif message['role'] == 'system' %}{{ '<<SYS>>\n' + message['content'] + '\n<</SYS>>\n\n' }}{% endif %}{% endfor %}"
