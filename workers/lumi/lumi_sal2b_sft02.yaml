# SAL2B-SFT02 — faza 2: instruction-dense continued-LoRA na sal2b-sft01 adapteru.
# Povod: sft01 proba — rjecnicki zanr OK ali instrukcije se ignorisu (98k dict
# nadjacalo 1.3k instrukcija) + fakticke greske. Mix: instructions x5 + bc-train
# x2 + knowledge 8k + rag 4k -> 14.448 dedup, eval isti frozen 429 (disjunktno).
# lr 2e-5 (nastavak), 1 epoha ~903 koraka (~40 min). Cilj: >=8/10 probe ontopic.
experiment_id: sal2b-sft02
mode: sft
model_name: BSC-LT/salamandra-2b
model_revision: f3a6092c93948fea08ab618388d7b78c40ad63df
base_adapter: /scratch/project_465003647/agentmujo/jobs/sal2b-sft01/outputs/adapter
dataset: local
data_file: /scratch/project_465003647/agentmujo/jobs/sal2b-sft02/data/train.jsonl
split: train
max_samples: null
output_dir: /scratch/project_465003647/agentmujo/jobs/sal2b-sft02/outputs
max_seq_length: 2048
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 1
warmup_ratio: 0.05
weight_decay: 0.0
logging_steps: 25
save_steps: 300
save_total_limit: 2
gradient_checkpointing: true
load_in_4bit: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
optim: paged_adamw_8bit
loss_type: nll
seed: 37
resume_from_checkpoint: null
eval_file: /scratch/project_465003647/agentmujo/jobs/sal2b-sft02/data/eval.jsonl
eval_steps: 200
# Salamandra-2B base nema chat_template (Llama-2 INST format, kao instruct familija).
chat_template: "{% for message in messages %}{% if message['role'] == 'user' %}{{ '[INST] ' + message['content'] + ' [/INST] ' }}{% elif message['role'] == 'assistant' %}{{ message['content'] + ' </s>' }}{% elif message['role'] == 'system' %}{{ '<<SYS>>\n' + message['content'] + '\n<</SYS>>\n\n' }}{% endif %}{% endfor %}"
